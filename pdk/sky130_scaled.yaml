# Scaled-process PDK descriptors (estimates only - no actual base cell).
# Used to project "what if we moved to a denser node?" in area reports.
# The ROM bitcell is the SKY130 AS-BUILT anchor (sky130_v4.yaml, bitcell
# 2.21 um^2/weight, one weight per cell, no array overhead baked in:
# estimate_layer applies array_overhead_frac separately). generic_65nm
# scales it by the square of the feature-size ratio. generic_28nm and
# generic_6nm carry it over at the node's pitches instead, as asap7.yaml
# does, scaling by minimum metal pitch over 0.34 um and contacted gate
# pitch over 0.46 um (the sky130_fd_sc_hd routing grid and site). Clock
# frequency scales roughly with process (linear).
#
# SRAM and gate area come from published process data instead, because
# node names stopped tracking pitches below about 28 nm and the square of
# the name overstates density there:
#   - sram_um2_per_bit is the foundry's high-density 6T cell over a 70%
#     macro array efficiency. That ratio reproduces the asap7 pack's
#     measured FakeRAM 0.04 um^2/bit from a 7nm-class 0.027 um^2 cell.
#   - generic_6nm's gate area follows the asap7 convention (NAND2 area
#     times the measured synth_calibration of 0.42, see asap7.yaml), the
#     only measured mapping of the estimator's gate counts onto a FinFET
#     library. generic_65nm and generic_28nm keep the SKY130-relative gate
#     area, which sits inside the bracket published data gives for them.
#
# BiROMA (2 weights/cell) is NOT in these baselines; within its 65-28 nm
# viability window the tools apply it via --biroma on top.

# GlobalFoundries 65nm class
- name: generic_65nm
  process_nm: 65
  node_scale: 4.0                   # (130/65)^2 = 4
  bitcell_um2: 0.5525            # 2.21 / 4
  gate_equivalent_um2: 1.25         # 5.0 / 4
  transistors_per_gate: 4
  popcount_gates_per_row: 25
  synth_calibration: 1.0
  between_layer_gates_per_channel: 1000
  serializer_gates_per_row: 15
  sram_um2_per_bit: 0.71            # 6T cell under 0.5 um^2 (TSMC 65nm, https://pr.tsmc.com/english/news/1390) / 0.7
  array_overhead_frac: 0.18
  die_routing_overhead_frac: 0.15
  clock_mhz: 400
  vdd_v: 1.2
  clock_skew_alpha: 0.0            # speculative; needs CTS-derived value
  wire_hop_cycles: 0
  kv_access_cycles_per_layer: 0
  clock_domain_area_mm2: 0    # 0 = derive from per-tile area
  crossing_cycles_per_hop: 2

# TSMC 28nm class
- name: generic_28nm
  process_nm: 28
  node_scale: 21.6                  # (130/28)^2 ~= 21.6
  bitcell_um2: 0.149             # 2.21 x 90/340 metal pitch x 117/460 gate pitch (https://www.realworldtech.com/iedm-2010/6, https://semiwiki.com/semiconductor-manufacturers/tsmc/1789-16nm-finfet-versus-20nm-planar/)
  gate_equivalent_um2: 0.23         # raw gate density 3900 kgate/mm^2 gives 0.26 per NAND2 (https://www.eetimes.com/?p=1171184)
  transistors_per_gate: 4
  popcount_gates_per_row: 25
  synth_calibration: 1.0
  between_layer_gates_per_channel: 1000
  serializer_gates_per_row: 15
  sram_um2_per_bit: 0.18            # 0.127 um^2 6T cell (TSMC 28LP, https://pr.tsmc.com/english/news/1556) / 0.7
  array_overhead_frac: 0.18
  die_routing_overhead_frac: 0.15
  clock_mhz: 1000
  vdd_v: 0.9
  clock_skew_alpha: 0.0            # speculative; needs CTS-derived value
  wire_hop_cycles: 0
  kv_access_cycles_per_layer: 0
  clock_domain_area_mm2: 0    # 0 = derive from per-tile area
  crossing_cycles_per_hop: 3

# TSMC 6nm class (Taalas reference)
- name: generic_6nm
  process_nm: 6
  node_scale: 469.4                 # (130/6)^2 ~= 469
  bitcell_um2: 0.032             # 2.21 x 40/340 metal pitch x 57/460 gate pitch (https://us.design-reuse.com/news/41051/tsmc-ibm-7-nm.html, https://en.wikichip.org/wiki/N7)
  gate_equivalent_um2: 0.037        # NAND2 area, N7's 91.2 MTr/mm^2 over 4 transistors (https://en.wikichip.org/wiki/N7) less N6's 18% logic density gain
  transistors_per_gate: 4
  popcount_gates_per_row: 25
  synth_calibration: 0.42           # the asap7 pack's measured complex-cell mapping
  between_layer_gates_per_channel: 1000
  serializer_gates_per_row: 15
  sram_um2_per_bit: 0.039           # 0.027 um^2 6T cell (TSMC N7, which N6 shares, Wu et al. IEDM 2016) / 0.7
  array_overhead_frac: 0.15
  die_routing_overhead_frac: 0.12
  # Production-tile fmax in multi-domain mode (1.5 GHz calibrated to Taalas's published N6
  # implied tile clock, NVIDIA H100 SM ~1.83 GHz, AMD MI300 ~2.1 GHz lower
  # bound). NOT the small-block synthesis target (which would be ~2.5 GHz
  # but is unachievable at production-tile scale).
  clock_mhz: 1500
  vdd_v: 0.75
  clock_skew_alpha: 0.0            # speculative; needs CTS-derived value
  wire_hop_cycles: 0
  kv_access_cycles_per_layer: 0
  # Matches H100/B200/MI300 tile scale: ~16 mm^2 synchronous islands with
  # 3-cycle async-FIFO crossings. Reproduces Taalas's 17K tok/s headline.
  clock_domain_area_mm2: 0    # 0 = derive from per-tile area
  crossing_cycles_per_hop: 3
