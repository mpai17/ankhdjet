# SKY130 (130nm) BiROMA-DENSITY-BOUND descriptor for Ankhdjet estimates.
# NOT the as-built anchor (that is sky130_v4.yaml): this one carries the
# 2-weights-per-cell density bound for bracketing what a smaller-node
# port recovers. Report both, per docs/results.md.
name: sky130_biroma_bound
process_nm: 130
node_scale: 1.0             # scaling factor relative to reference (1.0 for SKY130 itself)

# CiROM bitcell: this descriptor carries the BiROMA-DENSITY BOUND
# (bitcell_v4_biroma at its pre-rework pitch). BiROMA is NO-GO at
# SKY130 (see docs/biroma_design.md; viability window 65-28nm), so
# this anchor brackets what a smaller-node port recovers rather than a
# SKY130 roadmap. The silicon-verified as-built density lives in
# sky130_v4.yaml; report both.
#
# Bound: a BiROMA cell (2 ternary weights per 1T footprint via E/O
# bidirectional read) at a 0.73 x 0.89 um transistor pitch =
# 0.325 um^2 / weight raw. The verified bitcell_v4 implementation
# closes DRC/LVS at a 1.70 x 1.30 um pitch with the full column
# plumbing (BL+/BL- strips, li source-ground network, mask-jog lanes,
# gate-top contact stack at L=0.17), one weight per cell:
# 2.21 um^2 / weight as built. Recovery at this node is column
# plumbing compaction only; the 2x encoding is a smaller-node lever.
#
# Pairs with SUBCOL_ROWS=64 to keep the SS-corner BL discharge under
# 1.5 ns at the smaller W=0.42 drive (validated in
# cell/sky130/bitcell_v4/sim/test_harness.sp).
#
# Body tap is a separate body_tap.mag cell shared every 8 rows
# (gen_array.tcl default) per the SKY130 latch-up rule.
#
# Density progression (all v4 cells DRC-clean against SKY130 drc(full)
# at the cell + subcolumn level — gen_*.tcl in
# cell/sky130/bitcell_v4/):
#   v2 (PCell + body tap):                       6.20 um^2 / weight   archived
#   v3 (PCell aggressive min, W=0.84):           0.80 um^2 / weight   superseded
#   v3_biroma:                                   0.40 um^2 / weight   superseded
#   v4 (as built, 1.70 x 1.30 with plumbing):    2.21 um^2 / weight   silicon
#   v4 (pre-rework raw cell):                    0.65 um^2 / weight   superseded
#   v4_biroma (2 weights, bound only):           0.325 um^2 / weight  NO-GO at 130nm
bitcell_um2: 0.325

# Standard-cell gate area reference (sky130_fd_sc_hd, ~2-input NAND equivalent).
# Used as the unit for peripheral gate counting.
gate_equivalent_um2: 5.0

# Transistors per "gate equivalent" (a NAND2 is ~4 transistors).
transistors_per_gate: 4

# Popcount tree cost per row. Calibrated against a Yosys run targeting
# sky130_fd_sc_hd: the popcount+accumulator lumped together is about 12
# gate equivalents per row, with the tree's widening top levels adding
# log-growing overhead captured in `synth_scale_log`.
popcount_gates_per_row: 25     # value at N=16; scales as log2(N+1)/log2(17)

# Between-layer per-channel cost (requantize = multiply + shift + clip).
# ~8x8 multiplier + small combinational: ~300 gate equivalents.
between_layer_gates_per_channel: 300

# Serializer per-row cost: 1 flop + small mux to pick the current bit.
serializer_gates_per_row: 12

# Calibration factor on top of the analytical estimate. Derived from
# Yosys synthesis against sky130_fd_sc_hd. With popcount_gates_per_row=25
# and log2-scaling of the tree cost:
#   Per-layer (no baked-weight optimization):
#     N=16,M=16  synth=0.079  model=0.128  ratio 0.62
#     N=128,M=64       3.851        4.487        0.86
#   Tiled layer (same):
#     N=32,M=32 tc=16  0.065        0.135        0.48
#     N=128,M=64 tc=32 0.264        0.404        0.65
#   Full pipeline (Yosys opt across layer boundaries):
#     3-layer tiled:   0.305        0.707        0.43
#   Pipelined tiled (acc_reg per layer, epoch scheduler), 3-layer 32->16->8->4 tc=8:
#     sequential       synth=0.0786  model_pre_die=0.1587  synth/model=0.49
#     pipelined=True   synth=0.0910  model_pre_die=0.1738  synth/model=0.52
# 0.50 brings both modes into ~1.0x agreement with synth. Re-run
# tools/synth_calibrate.py and tools/synth_full_pipeline.py after RTL changes.
synth_calibration: 0.50

# SRAM full-block density (with decoders/SAs) - used for KV cache.
sram_um2_per_bit: 1.0

# Array-level overhead. Beyond the cells themselves, the array needs:
#   row/column decoders, precharge/drivers, local BL/WL routing.
# Empirical: +20% area on top of the raw cell count.
array_overhead_frac: 0.20

# Die-level overhead for power grid, clock tree, I/O pads, routing.
# Empirical: 15% of die reserved.
die_routing_overhead_frac: 0.15

# Target clock frequency (pre-synthesis estimate from similar 130nm digital designs).
# Synthesis calibration will refine this.
clock_mhz: 200

# Power rails / supply
vdd_v: 1.8

# Throughput-derating knobs. Defaults to 0 (RTL-ideal). Real values must
# come from a CTS/RC-extraction pass — see tools/throughput_calibrate.py.
# Until that exists, the headline tokens/sec is an upper bound, not a
# physically-grounded estimate.
clock_skew_alpha: 0.0           # effective_fmax = clock_mhz / (1 + alpha*sqrt(domain_area))
wire_hop_cycles: 0              # cycles per inter-layer activation register hop
kv_access_cycles_per_layer: 0   # cycles per layer per token for KV-cache access

# Multi-clock-domain partitioning. Default 25 mm^2/domain at 130 nm
# (sqrt-skew is forgiving here so domains can be larger). 2-FF async-FIFO
# synchronizer crossings = 2 cycles per hop.
clock_domain_area_mm2: 0    # 0 = derive from per-tile area
crossing_cycles_per_hop: 2
