# Measured / signoff achieved-fmax vs area for taped-out designs on the only
# two open PDKs with significant tapeout history (SKY130 and GF180MCU). Used
# to fit the clock-tree skew coefficient alpha in:
#     effective_fmax = ideal_clock / (1 + alpha * sqrt(area_mm2))
#
# Source-string convention:
#   "measured-on-silicon"  -- fmax confirmed on a fabricated, packaged die
#   "signoff-not-silicon"  -- post-CTS / STA closure, fab'd or queued for fab,
#                             but no published bench number yet
#   "synthesis_only"       -- target frequency from constraint.sdc with no
#                             post-route closure; EXCLUDE from the alpha fit
#
# Areas refer to the timing-closed block (core or user-area), not padframe.

# ---------- SKY130 (130 nm) ----------

- name: "OpenROAD sky130hd gcd"
  process_nm: 130
  area_mm2: 0.014
  achieved_fmax_mhz: 222
  source: "OpenROAD-flow-scripts sky130hd/gcd, clk_period 4.5 ns; small-block reference; signoff-not-silicon (ORFS public CI metrics.json)"

- name: "OpenROAD sky130hd AES cipher"
  process_nm: 130
